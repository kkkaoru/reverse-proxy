account_id = "${CLOUDFLARE_ACCOUNT_ID}"
name = "reverse-proxy-queue"
main = "src/index.ts"
compatibility_date = "2025-10-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[browser]
binding = "BROWSER"

[[kv_namespaces]]
binding = "KV"
id = "${CLOUDFLARE_KV_NAMESPACE_ID}"

[vars]
API_DOMAIN = "${API_DOMAIN}"
# Cache API control (optional, default: false)
ENABLE_CACHE_API = "${ENABLE_CACHE_API}"
# IP Rotate configuration (optional)
# Note: IP_ROTATE_ENDPOINTS is stored in KV (use `bun run upload-endpoints`)
# For production, consider using `wrangler secret put` for sensitive values
IP_ROTATE_AUTH_TYPE = "${IP_ROTATE_AUTH_TYPE}"
IP_ROTATE_API_KEY = "${IP_ROTATE_API_KEY}"
IP_ROTATE_AWS_ACCESS_KEY_ID = "${IP_ROTATE_AWS_ACCESS_KEY_ID}"
IP_ROTATE_AWS_SECRET_ACCESS_KEY = "${IP_ROTATE_AWS_SECRET_ACCESS_KEY}"
IP_ROTATE_AWS_REGION = "${IP_ROTATE_AWS_REGION}"
# Banned regions for IP rotation (comma-separated, e.g. "eu-west-1,eu-west-2")
IP_ROTATE_BANNED_REGIONS = "${IP_ROTATE_BANNED_REGIONS}"
# Default fetch timeout in milliseconds (optional, default: 2000)
DEFAULT_TIMEOUT_MS = "${DEFAULT_TIMEOUT_MS}"
# IP rotation tuning (all optional, shown with defaults)
# IP_ROTATE_HEALTH_TTL_MS = "60000"
# IP_ROTATE_EWMA_HALF_LIFE_MS = "30000"
# IP_ROTATE_MAX_HEDGE_ATTEMPTS = "2"
# IP_ROTATE_HEDGE_DELAY_MS = "500"
# IP_ROTATE_THROTTLE_BASE_DELAY_MS = "100"

[[durable_objects.bindings]]
name = "HEALTH_COORDINATOR"
class_name = "EndpointHealthCoordinator"

[[migrations]]
tag = "v1"
new_classes = ["EndpointHealthCoordinator"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
